# ============================================================
#  ตั้งค่า Mascot Newsbot — แก้ไฟล์นี้ได้เลย ไม่ต้องแตะโค้ด
# ============================================================

# ---------- ตัว mascot (AI จะเขียนแคปชันด้วยบุคลิกนี้) ----------
mascot:
  name: "น้องปิ๊ง"
  personality: "ไวและกระตือรือร้น รู้ข่าวก่อนบอกก่อน พูดสั้น ชัด เข้าใจง่าย สรุปให้จบในประโยคเดียวแล้วค่อยลงรายละเอียด เป็นมิตรและน่าเชื่อถือ สนุกได้แต่ไม่เกินจริง ข้อมูลต้องถูกต้องเสมอ"
  voice: "เปิดแคปชันด้วย 'ปิ๊ง!' แล้วตามด้วยใจความในประโยคเดียว ใช้คำว่า 'เรา' กับ 'ทุกคน' ห้ามใช้คำเกินจริง ห้ามแซวในข่าวร้าย ใส่อีโมจิไม่เกิน 1 ตัวต่อโพสต์"
  sign_off: ""          # คำลงท้ายประจำตัว (เว้นว่างได้)

# ---------- บรรณาธิการ (AI เรียบเรียงโพสต์) ----------
editor:
  fact_check: true       # ให้ AI อีกตัวตรวจโพสต์เทียบกับข่าวต้นทางก่อนส่ง (+1 ครั้งต่อข่าวด่วน)

# ---------- รูปโพสต์ (การ์ดข่าวน้องปิ๊ง แนบมากับแจ้งเตือนใน LINE) ----------
# รูปเก็บไว้ใน branch "cards" ของ repo นี้ (repo ต้องเป็น Public เพื่อให้ LINE เปิดรูปได้)
card:
  enabled: true
  size: [1080, 1080]     # [1080, 1080] จัตุรัส หรือ [1080, 1350] แนวตั้ง 4:5
  page_name: ""          # ชื่อเพจที่มุมขวาบน (เว้นว่างได้) ถ้ามีโลโก้ ให้วางไฟล์ assets/logo.png แทน
  # ภาพพื้นหลังการ์ด:
  #   ai    = ให้ AI วาดภาพประกอบตามเนื้อข่าว (เลือกผู้ให้บริการที่ image_provider)
  #           ถ้ายังไม่ได้ตั้งค่า หรือวาดไม่สำเร็จ จะใช้ภาพถ่ายจาก Pixabay แทน
  #   photo = ภาพถ่ายฟรีที่เกี่ยวกับข่าว จาก Pixabay (ต้องมี PIXABAY_API_KEY ฟรี)
  #           หรือจาก Pexels ถ้ามี PEXELS_API_KEY อยู่แล้ว (Pexels หยุดออก key ใหม่)
  #   plain = พื้นสีเรียบแบบเดิม
  # ถ้าหาภาพที่เหมาะไม่ได้ ระบบจะใช้พื้นสีเรียบให้อัตโนมัติ
  background: ai
  # ผู้ให้บริการ AI วาดภาพ (ใช้เมื่อ background: ai)
  #   cloudflare = Cloudflare Workers AI โมเดล FLUX ฟรีวันละ 10,000 neurons (ราว 130 ภาพ/วัน)
  #                รีเซ็ต 07:00 น. เวลาไทย ต้องมี CLOUDFLARE_ACCOUNT_ID และ CLOUDFLARE_API_TOKEN
  #   gemini     = Gemini วาด (เสียเงิน ต้องเปิด billing)
  image_provider: cloudflare
  image_model: ""        # เว้นว่าง = ค่าเริ่มต้น (cloudflare: @cf/black-forest-labs/flux-1-schnell)
  # สไตล์ภาพที่ AI วาด (ลองดูภาพตัวอย่างทุกแบบได้ด้วยคำสั่ง paint-test)
  #   painting  = ภาพวาดกึ่งสมจริง แสงและสัดส่วนสมจริง แต่ยังดูออกว่าเป็นภาพวาด
  #   realistic = เหมือนภาพถ่ายข่าว (ระวัง: คนอาจเข้าใจว่าเป็นภาพจากเหตุการณ์จริง)
  #   flat      = ภาพแบนแบบการ์ตูน
  image_style: painting
  ai_pick: true          # ให้ AI ตรวจภาพที่วาด หรือเลือกภาพถ่ายที่เข้ากับข่าว (+1 ครั้งต่อข่าวด่วน)

# ---------- เกณฑ์การแจ้งเตือน ----------
alerts:
  threshold: 70             # คะแนนความด่วน (0-100) ตั้งแต่เท่านี้ขึ้นไป แจ้ง LINE ทันที
  max_per_run: 3            # แจ้งด่วนได้สูงสุดกี่เรื่องต่อรอบ (กันข้อความท่วม)
  max_age_hours: 6          # ข่าวที่ออกมานานกว่านี้ จะไม่แจ้งด่วน (ไปอยู่ในสรุปรอบวันแทน)
  quiet_hours: [0, 6]       # ช่วงเวลาไม่รบกวน (เวลาไทย) ใส่ [] เพื่อปิด
  quiet_override: 90        # ช่วงไม่รบกวน ยังแจ้งข่าวที่คะแนนตั้งแต่เท่านี้

# ---------- สรุปข่าวรอบวัน (ข่าวที่ไม่ด่วนแต่น่าสนใจ) ----------
digest:
  hours: [8, 12, 18]        # ส่งสรุปกี่โมงบ้าง (เวลาไทย)
  min_score: 35             # ข่าวคะแนนต่ำกว่านี้ไม่ใส่ในสรุป
  max_items: 8              # สรุปละไม่เกินกี่เรื่อง

# ---------- การอ่านข่าว ----------
fetch:
  max_item_age_hours: 6     # อ่านเฉพาะข่าวที่เผยแพร่ภายในกี่ชั่วโมงล่าสุด
  timeout_seconds: 20

# ---------- AI ----------
# provider: gemini = ใช้ฟรี (free tier ของ Google AI Studio) ต้องมี GEMINI_API_KEY
#           claude = เสียเงินตามการใช้จริง ต้องมี ANTHROPIC_API_KEY
ai:
  provider: gemini
  gemini:
    triage_model: "gemini-3.5-flash-lite"   # ตัวคัดกรอง/จัดกลุ่มข่าว
    triage_level: "low"                     # ระดับการคิด: minimal / low / medium / high
    analysis_model: "gemini-3.8-flash"      # ตัววิเคราะห์ละเอียด + เรียบเรียงโพสต์
    analysis_level: "medium"                # (free tier ได้ราววันละ 20 ครั้ง = ข่าวด่วนราว 10 เรื่อง/วัน)
    review_model: "gemini-3.5-flash-lite"   # ตัวตรวจทาน + เลือกภาพ (ใช้โควตาแยกจากตัววิเคราะห์)
    review_level: "medium"
  claude:
    triage_model: "claude-haiku-5-5"
    triage_level: "low"
    analysis_model: "claude-sonnet-5-5"
    analysis_level: "medium"
    review_model: "claude-haiku-5-5"
    review_level: "medium"

