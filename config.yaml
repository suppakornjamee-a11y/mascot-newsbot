    url: https://www.matichon.co.th/feed
  - name: ประชาชาติธุรกิจ
    url: https://www.prachachat.net/feed
  - name: ข่าวสด
    url: https://www.khaosod.co.th/feed
  - name: ไทยโพสต์
    url: https://www.thaipost.net/feed/
  - name: Workpoint Today
    url: https://workpointtoday.com/feed/
  - name: The Reporters
    url: https://www.thereporters.co/feed/
  - name: Khaosod English
    url: https://www.khaosodenglish.com/feed/
  - name: กรมอุตุฯ แผ่นดินไหว
    url: https://www.tmd.go.th/api/xml/earthquake-report
    official: true
    link: https://www.tmd.go.th/EarthQuake
  - name: กรมอุตุฯ ประกาศเตือนภัย
    url: https://www.tmd.go.th/api/xml/warning-news
    official: true
    link: https://www.tmd.go.th/warning-and-events/warning-storm

  # ยังตรวจสอบไม่ผ่านตอนสร้างระบบ (เว็บอาจบล็อกบอท) ลองเปิดแล้วรัน check-sources
  - name: THE STANDARD
