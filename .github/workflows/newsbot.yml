name: Mascot Newsbot

on:
  schedule:
    - cron: "*/30 * * * *"      # ทุก 30 นาที ตลอดวัน (ช่วงไม่รบกวนตั้งใน config.yaml)
  workflow_dispatch:            # ปุ่ม "Run workflow" สำหรับกดรันเอง
    inputs:
      command:
        description: "คำสั่ง: run = รันปกติ, demo = ส่งข่าวเด่น 24 ชม.เป็นตัวอย่าง, test-line = ส่งข้อความทดสอบ, check-sources = ตรวจแหล่งข่าว, paint-test = ให้ AI วาดภาพตัวอย่างทุกสไตล์ (ไม่ส่ง LINE)"
        type: choice
        options: [run, demo, test-line, check-sources, paint-test]
        default: run

permissions:
  contents: write              # ให้ระบบอัปโหลดรูปโพสต์ไปที่ branch cards

concurrency:
  group: newsbot                # ห้ามรันซ้อนกัน
  cancel-in-progress: false

jobs:
  newsbot:
    runs-on: ubuntu-latest
    timeout-minutes: 15          # ข่าวด่วนแต่ละเรื่องใช้ AI 4 ครั้ง (วิเคราะห์ เรียบเรียง ตรวจทาน เลือกภาพ)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Restore state (ข่าวที่เคยเห็นแล้ว)
        uses: actions/cache/restore@v4
        with:
          path: data
          key: newsbot-state-${{ github.run_id }}
          restore-keys: newsbot-state-

      - name: Run newsbot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMAND: ${{ inputs.command || 'run' }}
        run: python -m newsbot "$COMMAND"

      - name: Save state
        if: always() && hashFiles('data/state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: data
          key: newsbot-state-${{ github.run_id }}
